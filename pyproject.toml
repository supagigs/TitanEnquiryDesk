[project]
name = "titan_desk"
authors = [{ name = "Renocrew Solutions LLP", email = "hello@renocrew.com" }]
description = "Titan Enquiry Desk: enquiry inbox, WhatsApp and follow-up workspace on Frappe CRM"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"
[tool.ruff.format]
indent-style = "tab"
